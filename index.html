<script src="js/ux-place.js"></script>
<script>
  /* boot: the shell lives in js/app.js, the lesson engine in js/player.js,
     the experience layer in js/ux.js */
  document.addEventListener('DOMContentLoaded', function () {
    var originalRender = LB.render;
    LB.render = function () {
      /* lesson routes are handled by the player (it needs the per-step state) */
      var parsed = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
      if (parsed[0] === 'lesson') {
        var res = LB.player.lesson({ name: 'lesson', parts: parsed });
        document.getElementById('lb-header').innerHTML = '';
        document.getElementById('lb-bottom-nav').innerHTML = '';
        var view = document.getElementById('lb-view');
        view.innerHTML = res.html;
        LB.player.wireLesson(view, res.lang, res.lesson);
        LB.wireSpeech(view); LB.wireOpen(view); LB.wireQuiz(view);
        if (LB.ux) LB.ux.afterLesson(view, res.lang, res.lesson);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      originalRender();
    };
    LB.boot();
  });
</script>
